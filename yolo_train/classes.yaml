# UI 元素检测类别定义
# 用于 YOLOv8 训练和 ONNX 推理
# 类别 ID 从 0 开始，与训练数据标注一致

names:
  0: button
  1: input
  2: checkbox
  3: radio
  4: dropdown
  5: tab
  6: menu_item
  7: icon
  8: link
  9: text_field
  10: search_box
  11: send_button
  12: close_button
  13: minimize_button
  14: maximize_button
  15: scrollbar
  16: slider
  17: toggle
  18: tooltip
  19: image
